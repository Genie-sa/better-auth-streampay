name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Node ${{ matrix.node }} / Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        if: matrix.node != '20.19.0'
        run: pnpm check

      - name: Check on Node 20
        if: matrix.node == '20.19.0'
        run: pnpm lint && pnpm typecheck && pnpm vitest run --exclude tests/live/**/*.test.ts --exclude tests/integration/**/*.test.ts && pnpm build && node -e 'import("./dist/index.js")' && node -e 'require("./dist/index.cjs")'

  minimum-peer-compatibility:
    name: Better Auth 1.5 / Zod 3.24 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install minimum supported peers
        run: pnpm add --save-dev better-auth@1.5.0 zod@3.24.0 --lockfile=false

      - name: Verify compatibility
        run: pnpm typecheck && pnpm test && pnpm build
